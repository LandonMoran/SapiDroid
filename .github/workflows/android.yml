name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test JNI PCM streaming
        run: |
          mkdir -p "$RUNNER_TEMP/pcm-test"
          cc -shared -fPIC -std=c99 -Wall -Wextra -Werror -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" app/src/test/native/pcm_stream_test.c -o "$RUNNER_TEMP/pcm-test/libpcm-test.so"
          javac -d "$RUNNER_TEMP/pcm-test" app/src/test/native/PcmStreamTest.java
          java -cp "$RUNNER_TEMP/pcm-test" PcmStreamTest "$RUNNER_TEMP/pcm-test/libpcm-test.so"
          cc -shared -fPIC -std=c99 -Wall -Wextra -Werror -U__BYTE_ORDER__ -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" app/src/test/native/pcm_stream_test.c -o "$RUNNER_TEMP/pcm-test/libpcm-test-portable.so"
          java -cp "$RUNNER_TEMP/pcm-test" PcmStreamTest "$RUNNER_TEMP/pcm-test/libpcm-test-portable.so"
          # The profiler (-Pprofile) is opt-in, so nothing else in CI compiles it: build it both ways
          # and run the PCM test against the instrumented path so it cannot rot between device runs.
          cc -std=c99 -Wall -Wextra -Werror -c app/src/main/cpp/prof.c -o "$RUNNER_TEMP/pcm-test/prof-off.o"
          cc -std=c99 -Wall -Wextra -Werror -DSAPIDROID_PROFILE -c app/src/main/cpp/prof.c -o "$RUNNER_TEMP/pcm-test/prof-on.o"
          cc -shared -fPIC -std=c99 -Wall -Wextra -Werror -DSAPIDROID_PROFILE \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -Iapp/src/main/cpp \
            app/src/test/native/pcm_stream_test.c app/src/main/cpp/prof.c -o "$RUNNER_TEMP/pcm-test/libpcm-test-profile.so"
          java -cp "$RUNNER_TEMP/pcm-test" PcmStreamTest "$RUNNER_TEMP/pcm-test/libpcm-test-profile.so"
          cc -std=c99 -D_DEFAULT_SOURCE -fPIC -shared -Wall -Wextra -Werror -Wno-unused-parameter \
            -Wl,--wrap=malloc -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -Iapp/src/test/native -Iapp/src/main/cpp/sapi4/lib -Iapp/src/main/cpp \
            app/src/test/native/sapi4_jni_list_modes_test.c -o "$RUNNER_TEMP/pcm-test/libsapi4_jni_list_modes_test.so"
          javac -d "$RUNNER_TEMP/pcm-test" app/src/test/native/Sapi4JniListModesTest.java
          java -Djava.library.path="$RUNNER_TEMP/pcm-test" -cp "$RUNNER_TEMP/pcm-test" org.sapidroid.tts.Sapi4JniListModesTest
      - name: Test native engine fast paths
        run: |
          for test in onecore_fast_path_test anna_fast_path_test anna_decoder_bounds_test sapi4_queue_test sapi4_stage_queue_test sapi5_fast_path_test sapi5_fx_fast_path_test; do
            cc -std=c99 -O2 -Iapp/src/main/cpp/sapi4/src -Iapp/src/main/cpp/sapi4/port \
              -ffunction-sections -fdata-sections "app/src/test/native/$test.c" -Wl,--gc-sections -lm -pthread -o "$RUNNER_TEMP/$test"
            "$RUNNER_TEMP/$test"
          done
          cc -std=c99 -D_DEFAULT_SOURCE -O2 -Iapp/src/main/cpp/sapi4/src -Iapp/src/main/cpp/sapi4/port \
            -ffunction-sections -fdata-sections app/src/test/native/sapi4_start_cancel_test.c \
            app/src/main/cpp/sapi4/src/*.c app/src/main/cpp/sapi4/lib/stubs.c app/src/main/cpp/sapi4/port/dllimage.c \
            -Wl,--gc-sections -lm -pthread -o "$RUNNER_TEMP/sapi4_start_cancel_test"
          "$RUNNER_TEMP/sapi4_start_cancel_test"
          cc -std=c99 -O2 -ffp-contract=off -fno-fast-math app/src/test/native/onecore_cancel_test.c engine/*.c \
            -Wl,--wrap=zb_tree_leaf,--wrap=zb_state_gauss -lm -o "$RUNNER_TEMP/onecore_cancel_test"
          "$RUNNER_TEMP/onecore_cancel_test"
          cc -std=c99 -O2 -ffunction-sections -fdata-sections engine/tests/zira_tts_host_test.c -pthread \
            -Wl,--gc-sections,--wrap=malloc -o "$RUNNER_TEMP/zira_tts_host_test"
          "$RUNNER_TEMP/zira_tts_host_test"
          cc -std=c99 -O2 -ffunction-sections -fdata-sections engine/tests/zf1_enum_host_test.c engine/zf1_ana.c engine/zf1_util.c \
            -Wl,--gc-sections -o "$RUNNER_TEMP/zf1_enum_host_test"
          "$RUNNER_TEMP/zf1_enum_host_test"
          cc -std=c99 -O2 -ffunction-sections -fdata-sections engine/tests/zf1_compound_host_test.c \
            -Wl,--gc-sections -o "$RUNNER_TEMP/zf1_compound_host_test"
          "$RUNNER_TEMP/zf1_compound_host_test"
          cc -std=c99 -O2 -ffunction-sections -fdata-sections engine/tests/zf1_pron_error_host_test.c engine/*.c \
            -Wl,--gc-sections,--wrap=malloc -lm -o "$RUNNER_TEMP/zf1_pron_error_host_test"
          "$RUNNER_TEMP/zf1_pron_error_host_test"
          cc -std=c99 -O2 -pthread -ffunction-sections -fdata-sections engine/tests/zf2_word_position_host_test.c engine/zf2_feat.c engine/zf2_tree.c engine/zf2_units.c engine/zb_apm.c \
            -Wl,--gc-sections,--wrap=malloc,--wrap=calloc -lm -o "$RUNNER_TEMP/zf2_word_position_host_test"
          "$RUNNER_TEMP/zf2_word_position_host_test"
          cc -std=c99 -O2 -ffunction-sections -fdata-sections engine/tests/zf2_phone_map_host_test.c engine/zb_apm.c \
            -Wl,--gc-sections -lm -o "$RUNNER_TEMP/zf2_phone_map_host_test"
          "$RUNNER_TEMP/zf2_phone_map_host_test"
          cc -std=c99 -O2 -ffunction-sections -fdata-sections engine/tests/zb_pool_host_test.c engine/zb_apm.c \
            -Wl,--gc-sections -lm -o "$RUNNER_TEMP/zb_pool_host_test"
          "$RUNNER_TEMP/zb_pool_host_test"
          cc -std=c99 -O2 -ffunction-sections -fdata-sections engine/tests/zb_int_pool_host_test.c \
            -Wl,--gc-sections -lm -o "$RUNNER_TEMP/zb_int_pool_host_test"
          "$RUNNER_TEMP/zb_int_pool_host_test"
      - name: Build and test
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: sapidroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # The profiler is opt-in, so the normal build never compiles its Kotlin, its JNI entry
      # points or its AIDL method. Build the profiling variant too, so they cannot rot.
      - name: Build the profiling APK
        run: ./gradlew :app:assembleDebug -Pprofile --console=plain
      # The profiling build replaces the debug APK in the output folder, so upload it separately:
      # it is the one to install when collecting numbers on a phone that has the voices.
      - uses: actions/upload-artifact@v4
        with:
          name: sapidroid-profile-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  fallback-on-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare emulator
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "system-images;android-34;default;x86_64"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n sapidroid -k "system-images;android-34;default;x86_64"
          ls -la "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -avd sapidroid -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          sleep 10
          if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          if ! timeout 180 adb wait-for-device; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          if ! timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
      - name: Exercise speech fallback
        run: ./gradlew :app:connectedDebugAndroidTest -PemulatorTests --console=plain

  profile-on-emulator:
    # Opt-in and expensive: it boots an emulator, lets the app download Microsoft's voice data
    # (the app owns those URLs), speaks a few sentences per engine and uploads the exported
    # profile tables. Run it from the Actions tab, or push a commit whose message says
    # [profile-run]. It stays off every push because the downloads are ~270 MB of third-party data.
    #
    # These are emulator numbers: the DSP runs natively under KVM on a server CPU, so absolute
    # milliseconds are far below a phone's. What transfers is the shape of the request — which row
    # dominates, and how much of the engine call is spent blocked on the audio queue.
    #
    # Everything after the APK build is one step on purpose: a failure then has one place to look.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[profile-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the profiling APK
        timeout-minutes: 20
        run: |
          # A cold runner has to fetch the NDK and CMake; that fetch failed once already, so one
          # retry, and keep the log where the artifact can reach it.
          set -o pipefail
          status=1
          for attempt in 1 2; do
            if ./gradlew :app:assembleDebug -Pprofile --console=plain > "$RUNNER_TEMP/build.log" 2>&1; then
              status=0
              break
            fi
            echo "build failed on attempt $attempt"
            sleep 10
          done
          tail -3 "$RUNNER_TEMP/build.log"
          if [ "$status" != 0 ]; then tail -30 "$RUNNER_TEMP/build.log"; fi
          mkdir -p "$RUNNER_TEMP/profile-run"
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/profile-run/build.log" || true
          exit $status
      - name: Boot an emulator, fetch the voices, profile, export
        run: |
          set -eux
          OUT="$RUNNER_TEMP/profile-run"
          mkdir -p "$OUT"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ADB="$SDK/platform-tools/adb"
          [ -x "$ADB" ] || ADB=adb
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"

          echo "== boot"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} SDK=$SDK ADB=$ADB"
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "system-images;android-34;default;x86_64" > /dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          if [ ! -d "$ANDROID_AVD_HOME/profile.avd" ]; then
            echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n profile \
              -k "system-images;android-34;default;x86_64"
          fi
          "$ADB" start-server
          nohup "$SDK/emulator/emulator" -avd profile -no-window -no-audio -no-snapshot \
            -gpu swiftshader_indirect -memory 2048 -partition-size 4096 \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 180 "$ADB" wait-for-device
          booted=0
          for _ in $(seq 1 150); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=1; break; fi
            sleep 2
          done
          test "$booted" = 1 || { tail -40 "$RUNNER_TEMP/emulator.log"; exit 1; }
          "$ADB" shell wm dismiss-keyguard || true
          "$ADB" devices

          echo "== install"
          ls -l app/build/outputs/apk/debug/app-debug.apk
          "$ADB" install -r -t app/build/outputs/apk/debug/app-debug.apk
          "$ADB" shell pm path org.sapidroid.tts

          start_app() { # $@ = am extras
            "$ADB" shell am force-stop org.sapidroid.tts || true
            "$ADB" shell am start -W -n org.sapidroid.tts/.MainActivity "$@"
          }
          wait_for() { # $1 label, $2 path the app should create, $3 timeout seconds
            for _ in $(seq 1 $(( $3 / 5 ))); do
              if "$ADB" shell run-as org.sapidroid.tts ls "$2" > /dev/null 2>&1; then
                echo "$1 ready"; return 0
              fi
              sleep 5
            done
            echo "$1 missing after $3 s"
            "$ADB" logcat -d -s SapiDroidUi:* SapiDroidStorage:* SapiDroidNative:* | tail -40
            return 1
          }

          echo "== let the app fetch the voice data"
          start_app --es getdata sapi5
          wait_for "SAPI 5 voice data" /data/user_de/0/org.sapidroid.tts/files/sapi5/Sam.spd 900
          start_app --es getdata onecore --es voice David
          wait_for "OneCore David" /data/user_de/0/org.sapidroid.tts/files/voice/M1033David.APM 1200

          echo "== profile"
          SENTENCE="The quick brown fox jumps over the lazy dog while the band plays a long, steady tune."
          for voice in David David David Sam5 Sam5 Sam5; do
            echo "-- $voice"
            "$ADB" shell am force-stop org.sapidroid.tts || true
            "$ADB" shell am start -W -n org.sapidroid.tts/.MainActivity --es autospeak "$SENTENCE" --es voice "$voice"
            sleep 30
          done

          echo "== export"
          "$ADB" pull /sdcard/Android/data/org.sapidroid.tts/files/profile/profiling.txt "$OUT/profiling.txt"
          cat "$OUT/profiling.txt"
          echo "tables: $(grep -c '=== profile' "$OUT/profiling.txt" || true)"
          grep -q '=== profile' "$OUT/profiling.txt"
      - name: Keep the logcat and the file listings
        if: always()
        timeout-minutes: 4
        run: |
          OUT="$RUNNER_TEMP/profile-run"
          mkdir -p "$OUT"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ADB="$SDK/platform-tools/adb"
          [ -x "$ADB" ] || ADB=adb
          cp "$RUNNER_TEMP/emulator.log" "$OUT/emulator.log" 2> /dev/null || true
          cp "$RUNNER_TEMP/build.log" "$OUT/build.log" 2> /dev/null || true
          timeout 40 "$ADB" logcat -d > "$OUT/logcat.txt" 2>&1 || true
          timeout 40 "$ADB" shell run-as org.sapidroid.tts ls -l /data/user_de/0/org.sapidroid.tts/files/sapi5 > "$OUT/sapi5-files.txt" 2>&1 || true
          timeout 40 "$ADB" shell run-as org.sapidroid.tts ls -l /data/user_de/0/org.sapidroid.tts/files/voice > "$OUT/voice-files.txt" 2>&1 || true
          ls -l "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sapidroid-profile-run
          path: ${{ runner.temp }}/profile-run/
