name: Release

# Push a tag (v0.11.0) or start the workflow by hand with the tag to release. The APKs are signed
# with the keystore held in repository secrets, so every release keeps the same signing key and can
# be installed over the previous one, and they are attached to the GitHub release for that tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, for example v0.11.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check the release secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add the release keystore (base64) and its credentials under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Work out the version from the tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::Tag '$tag' must start with v (for example v0.11.0)."; exit 1 ;;
          esac
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag '$tag' does not exist. Create and push the tag first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the signed APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -PabiSplits \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            --console=plain

      - name: Verify every APK uses the release key
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found in the Android SDK"
            exit 1
          fi
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            found=1
            cert=$("$apksigner" verify --print-certs "$apk" | grep -m1 "SHA-256 digest" | sed 's/.*: //' | tr -d ': ' | tr 'A-F' 'a-f')
            echo "$(basename "$apk"): SHA-256 $cert"
            if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
              expected=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
              if [ "$cert" != "$expected" ]; then
                echo "::error::$apk is signed with a different key than EXPECTED_CERT_SHA256."
                echo "Publishing it would force users to uninstall (which deletes their voice data)."
                exit 1
              fi
            fi
          done
          if [ "$found" = "0" ]; then
            echo "::error::No APKs were produced."
            exit 1
          fi

      - name: Collect the release notes
        # A tag can carry hand-written notes in docs/releases/<tag>.md (what changed and what it
        # measured); without one the release keeps the standing note below. Either way GitHub appends
        # its generated list of commits and pull requests after this text.
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if [ -f "docs/releases/${{ steps.version.outputs.tag }}.md" ]; then
            cp "docs/releases/${{ steps.version.outputs.tag }}.md" "$notes"
          else
            printf 'Signed with the same release key as earlier versions, so it installs over them.\n\n' > "$notes"
            printf 'Pick `app-arm64-v8a-release.apk` for virtually every current phone, or the universal\n' >> "$notes"
            printf 'APK if you are unsure. Voice data is not included; install it from the app.\n' >> "$notes"
          fi
          echo "notes: $(wc -l < "$notes") lines"

      - name: Attach the APKs to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SapiDroid ${{ steps.version.outputs.name }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: ${{ runner.temp }}/release-notes.md
